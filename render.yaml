services:
  # ── FASTAPI BACKEND ──────────────────────────────────────────────
  - type: web
    name: novaresume-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: novaresume-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: "*"

# ── POSTGRESQL DATABASE ───────────────────────────────────────────
databases:
  - name: novaresume-db
    databaseName: novaresume
    user: novauser
